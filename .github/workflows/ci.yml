name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Check dependency pins
        run: ./script/check-dependencies.sh
      - name: Check authored Markdown
        run: ./script/check-markdown.sh
      - name: Check formatting
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: FOUNDRY_PROFILE=ci forge test
      - name: Check maturity and recovery gas bounds
        run: >-
          forge snapshot --check
          --match-test
          'testGasRecordsMaturityAfterMaximumProofWalk|testGasFinalizesRecoveryWithMaximumAdoptedBatches'
      - name: Check release gate wiring
        run: bash -n script/release-gate.sh
