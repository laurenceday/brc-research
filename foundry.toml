[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [
  { access = "read", path = "./config" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = true

[lint]
lint_on_build = false

[profile.ci]
fuzz = { runs = 1_000 }
invariant = { runs = 256, depth = 128 }
